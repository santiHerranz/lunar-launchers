<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" role="img" aria-labelledby="t d"><title id="t">Faster direct routes deliver less oxygen</title><desc id="d">Flight time to L1 against liquid oxygen delivered by a 500 kg capsule, for the 16 direct routes found by the slope search. Routes of 13-17 h deliver 225-261 kg; routes of 54-68 h deliver 370-374 kg. The main route, 84.92 W, takes 59 h and delivers 372 kg.</desc>
