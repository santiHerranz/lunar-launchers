<text x="28.0" y="518.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">Only 84.92°W is on the equator; off the equator, a rail aimed due east misses L1 out of plane. Capsule model: capsula_l1.py, 500 kg, 100 g, Isp 310 s.</text>
