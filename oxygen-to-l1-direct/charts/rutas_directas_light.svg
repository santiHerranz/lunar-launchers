<text x="298.8" y="250.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">Fast: 13–17 h, but they reach L1 at 835–1,096 m/s</text>
<text x="298.8" y="269.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">The capsule burns 137–170 kg of propellant to stop there,</text>
<text x="298.8" y="287.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">and the rail fires at up to 2,568 m/s (22 % more energy per shot)</text>
<text x="785.1" y="224.7" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">Slow: 54–68 h, arriving at 133–158 m/s</text>
<text x="785.1" y="243.7" font-size="13" font-weight="400" fill="#52514e" text-anchor="end">32–36 kg of propellant is enough</text>
